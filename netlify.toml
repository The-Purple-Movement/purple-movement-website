# Netlify builds this site from the `dev` branch (set in Site configuration → Build & deploy).
# Netlify detects Next.js and uses its Next.js runtime; `publish` must be `.next`.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Canonical URL for metadata, sitemap and structured data (not a secret).
  NEXT_PUBLIC_SITE_URL = "https://purple-movement.com"
  # Secrets are NOT stored here. Set these in Netlify → Site configuration → Environment variables:
  #   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
